      - $mdi_lightbulb_cfl_spiral
      - $mdi_glass_tulip
      - $mdi_waveform
      - $mdi_solar_power
      - $mdi_chevron_right
      - $mdi_chevron_left
      - $mdi_printer_3d_nozzle_outline
