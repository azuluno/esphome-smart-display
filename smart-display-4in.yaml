      - $mdi_thermometer_chevron_up
      - $mdi_stairs_box
      - $mdi_desk_lamp
      - $mdi_thermometer
      - $mdi_sprout_outline
      - $mdi_floor_lamp
      - $mdi_memory
      - $mdi_one_up
      - $mdi_water_opacity
      - $mdi_wifi_sync
      - $mdi_cog
      - $mdi_flask_outline
      - $mdi_panda
