  - file:
      path: "fonts/materialdesignicons-webfont.ttf"
      type: local
    id: mdi_icons_28
    size: 28
    bpp: 8
    glyphs: *base_mdi_glyphs

  - file:
      path: "fonts/materialdesignicons-webfont.ttf"
      type: local
    id: mdi_icons_20
    size: 20
    bpp: 8
    glyphs: *base_mdi_glyphs
      

  - file: &arimo_file
      path: "/config/esphome/fonts/Arimo-Regular.ttf"
      type: local
    glyphs: &arimo_glyphs " .°,|0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz:-%_/$+()"
    id: font_sm
    size: 12
  # Use the aliases (*) for all subsequent sizes
  - file: *arimo_file
    glyphs: *arimo_glyphs
    id: font_md
    size: 16

  - file: *arimo_file
    glyphs: *arimo_glyphs
    id: font_ss
    size: 10

  - file: *arimo_file
    glyphs: *arimo_glyphs
    id: marty_mcfly_font
    size: 23

 
  - file: "gfonts://Nunito"
    id: nunito_2026
    size: 20
